<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Python Files and Errors Assessment - Expense Tracker and Attendance Cleaner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"><animate attributeName="stop-color" values="#0b132b;#14213d;#0b132b" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#1c2541"><animate attributeName="stop-color" values="#1c2541;#0f3d4a;#1c2541" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fb6a6"/><stop offset="1" stop-color="#fca311"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- drifting bubbles -->
    <g fill="#1fb6a6" opacity=".14">
      <circle cx="120" cy="260" r="46"><animate attributeName="cy" values="260;230;260" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="70" r="70"><animate attributeName="cy" values="70;105;70" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#fca311" opacity=".12">
      <circle cx="930" cy="270" r="38"><animate attributeName="cy" values="270;240;270" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="50" r="28"><animate attributeName="cy" values="50;80;50" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>
    <!-- code-ish glyphs floating -->
    <g font-family="monospace" font-size="22" fill="#ffffff" opacity=".10">
      <text x="70" y="70">{ }<animate attributeName="opacity" values=".05;.2;.05" dur="5s" repeatCount="indefinite"/></text>
      <text x="1090" y="250">set()<animate attributeName="opacity" values=".05;.2;.05" dur="6s" repeatCount="indefinite"/></text>
      <text x="880" y="60">[x for x in y]<animate attributeName="opacity" values=".2;.05;.2" dur="7s" repeatCount="indefinite"/></text>
      <text x="60" y="300">try / except<animate attributeName="opacity" values=".2;.05;.2" dur="6.5s" repeatCount="indefinite"/></text>
    </g>
    <!-- icons: ledger + checklist -->
    <g transform="translate(88 96)">
      <rect width="92" height="116" rx="12" fill="#ffffff" opacity=".95"/>
      <rect x="14" y="16" width="64" height="10" rx="5" fill="#14213d"/>
      <rect x="14" y="40" width="40" height="8" rx="4" fill="#1fb6a6"/><rect x="60" y="40" width="18" height="8" rx="4" fill="#fca311"/>
      <rect x="14" y="58" width="46" height="8" rx="4" fill="#1fb6a6"/><rect x="66" y="58" width="12" height="8" rx="4" fill="#fca311"/>
      <rect x="14" y="76" width="34" height="8" rx="4" fill="#1fb6a6"/><rect x="54" y="76" width="24" height="8" rx="4" fill="#fca311"/>
      <text x="46" y="108" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d" text-anchor="middle">CSV</text>
      <animateTransform attributeName="transform" type="translate" values="88 96;88 88;88 96" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1020 100)">
      <rect width="92" height="116" rx="12" fill="#ffffff" opacity=".95"/>
      <g fill="none" stroke="#1fb6a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 30l8 8 14-16"/><path d="M16 60l8 8 14-16"/><path d="M16 90l8 8 14-16"/>
      </g>
      <rect x="48" y="26" width="30" height="8" rx="4" fill="#14213d"/><rect x="48" y="56" width="30" height="8" rx="4" fill="#14213d"/><rect x="48" y="86" width="30" height="8" rx="4" fill="#14213d"/>
      <animateTransform attributeName="transform" type="translate" values="1020 100;1020 92;1020 100" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <!-- title -->
    <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Python Files &amp; Errors Assessment
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <rect x="360" y="140" width="480" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="0;480" dur="1.4s" fill="freeze"/>
      <animate attributeName="x" values="600;360" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cfe8ef">Expense Tracker  &#8226;  Attendance Cleaner</text>
    <!-- typing line -->
    <g font-family="Consolas, Menlo, monospace" font-size="19" fill="#fca311" text-anchor="middle">
      <text x="600" y="240">file handling  &#183;  exception handling  &#183;  sets  &#183;  comprehensions
        <animate attributeName="opacity" values="0;0;1;1;.65;1" keyTimes="0;.15;.3;.8;.9;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="600" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8fb3bf">Built with Python 3 standard library only</text>
  </g>
</svg>
